name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-test:
    name: server mvn test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run server tests
        run: cd server && mvn test

  client-typecheck:
    name: client typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and typecheck
        run: npm ci && npm run typecheck
